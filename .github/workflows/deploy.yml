name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    uses: jonathanperis/.github/.github/workflows/pages-docs-deploy.yml@adba222717af04bb96c72edeb1de1729f25d521a
    with:
      node-version: '24'
    secrets:
      PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}

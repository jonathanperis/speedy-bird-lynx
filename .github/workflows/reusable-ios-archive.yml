name: iOS unsigned archive

# Reusable unsigned archive build of the calling run's commit. It never reads Apple
# signing secrets; signed distribution requires separate signing and provisioning.

on:
  workflow_call:
    inputs:

permissions:
  contents: read

jobs:
  archive:
    name: Unsigned archive
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Xcode project
        id: check
        run: |
          if [ -d ios/SpeedyBird.xcodeproj ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping iOS build: ios/SpeedyBird.xcodeproj is not tracked."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-js
        if: steps.check.outputs.exists == 'true'

      # The Xcode project packages dist/main.lynx.bundle and assets/audio directly.
      - name: Build Lynx bundle
        if: steps.check.outputs.exists == 'true'
        run: bun run build

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        if: steps.check.outputs.exists == 'true'
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true

      - name: Install CocoaPods dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ios
        run: bundle exec pod install --deployment

      - name: Build unsigned archive
        if: steps.check.outputs.exists == 'true'
        run: |
          xcodebuild archive \
            -workspace ios/SpeedyBird.xcworkspace \
            -scheme SpeedyBird \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/SpeedyBird.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SpeedyBird.xcarchive" "$RUNNER_TEMP/SpeedyBird.xcarchive.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.check.outputs.exists == 'true'
        with:
          name: ios-archive
          path: ${{ runner.temp }}/SpeedyBird.xcarchive.zip
          if-no-files-found: error
          retention-days: 90

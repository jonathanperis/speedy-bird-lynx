name: Build Check
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run assets:check
      - run: bun run build:web-host
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: npm run check
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - name: Package complete browser and bundle distributions
        run: |
          tar -czf "$RUNNER_TEMP/lynx-bundles.tar.gz" -C dist .
          tar -czf "$RUNNER_TEMP/web-host.tar.gz" -C dist-web-host .
      - uses: actions/upload-artifact@v7
        with:
          name: game-distributions
          path: |
            ${{ runner.temp }}/lynx-bundles.tar.gz
            ${{ runner.temp }}/web-host.tar.gz
          if-no-files-found: error
          retention-days: 14

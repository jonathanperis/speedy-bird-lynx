name: Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every pull request, including stacked ones that target another feature branch.
  pull_request:
  schedule:
    # Weekly run catches upstream advisories and toolchain drift between changes.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      # Gating runs fail on high/critical advisories; the weekly run reports every severity.
      - name: Audit dependencies
        env:
          AUDIT_LEVEL: ${{ github.event_name == 'schedule' && 'low' || 'high' }}
        run: bun audit --audit-level="$AUDIT_LEVEL"

      - name: Lint and format
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Unit and component tests
        run: bun run test

      - name: Check docs asset copies
        run: bun run assets:check

      - name: Build
        run: bun run build

      - name: Build standalone web host
        run: bun run build:web-host

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lynx-bundles
          path: |
            dist/main.lynx.bundle
            dist/main.web.bundle
          retention-days: 14

  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lynx-bundles
          path: dist
      - uses: ./.github/actions/setup-android
      - name: Compile and lint Android host
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - name: Verify packaged bundle
        run: python3 scripts/verify_android_bundle.py android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Build Lynx bundle
        run: bun run build
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install --deployment
      # Builds the app and runs the XCUITest smoke tests on the newest available iPhone simulator.
      - name: Build and run UI tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -workspace ios/SpeedyBird.xcworkspace \
            -scheme SpeedyBird \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            -resultBundlePath "$RUNNER_TEMP/SpeedyBird.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/SpeedyBird.xcresult
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
        with:
          working-directory: docs
      - name: Audit dependencies
        working-directory: docs
        env:
          AUDIT_LEVEL: ${{ github.event_name == 'schedule' && 'low' || 'high' }}
        run: bun audit --audit-level="$AUDIT_LEVEL"
      - name: Build site
        working-directory: docs
        run: npm run build
      - name: Validate generated site
        working-directory: docs
        run: npm run check:site

  android-release:
    needs: [build, android, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/build-android.yml
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

name: Main Release Pipeline

# Sole publisher of versioned releases. A v* tag must point at a commit on main.
# Manual runs from main publish a v0.0.0-<sha> prerelease.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      version-name: ${{ steps.tag.outputs.VERSION_NAME }}
      prerelease: ${{ steps.tag.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          GH_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Releases must be built from a commit on main."
            exit 1
          }
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"
            VERSION_NAME="${REF_NAME#v}"
            # Semver prerelease tags (v1.2.0-rc.1) stay prereleases.
            if [[ "$VERSION_NAME" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          elif [ "$GH_REF" = refs/heads/main ]; then
            VERSION_NAME="0.0.0-${GITHUB_SHA:0:7}"
            TAG="v$VERSION_NAME"
            PRERELEASE=true
          else
            echo "::error::Run releases from main or a v* tag."
            exit 1
          fi
          {
            echo "TAG=$TAG"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-js

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Lint, type check, and test
        run: |
          bun run lint
          bun run check
          bun run test

      - name: Build Lynx bundles
        run: bun run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lynx-bundles
          path: |
            dist/main.lynx.bundle
            dist/main.web.bundle
          if-no-files-found: error

  android:
    needs: verify
    uses: ./.github/workflows/reusable-android-apk.yml
    with:
      version-name: ${{ needs.verify.outputs.version-name }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  ios:
    needs: verify
    uses: ./.github/workflows/reusable-ios-archive.yml

  create-release:
    needs: [verify, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp artifacts/lynx-bundles/* release-assets/
          cp artifacts/android-apk/*.apk release-assets/
          if [ -d artifacts/ios-archive ]; then cp artifacts/ios-archive/*.zip release-assets/; fi
          ls -la release-assets/

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish immutable release after asset upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false

name: Main Release Pipeline

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Lynx bundle
        run: bun run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lynx-bundles
          path: |
            dist/main.lynx.bundle
            dist/main.web.bundle

  # Android build — runs if android/ project exists
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Android project
        id: check
        run: test -f android/app/build.gradle.kts && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.check.outputs.exists == 'true'
        with:
          name: lynx-bundles
          path: dist/

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        if: steps.check.outputs.exists == 'true'
        run: |
          sdkmanager "cmdline-tools;latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        if: steps.check.outputs.exists == 'true'

      - name: Decode signing keystore when configured
        if: steps.check.outputs.exists == 'true' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Set Android version
        if: steps.check.outputs.exists == 'true'
        env:
          GH_REF: ${{ github.ref }}
        run: |
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            VERSION="${GH_REF#refs/tags/v}"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( $(date +%s) / 10 ))" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.check.outputs.exists == 'true'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify packaged bundle
        if: steps.check.outputs.exists == 'true'
        run: python3 scripts/verify_android_bundle.py android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.check.outputs.exists == 'true'
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # iOS build — runs if ios/ project exists
  ios:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for iOS project
        id: check
        run: |
          if test -f ios/Podfile && ls ios/*.xcodeproj 1>/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping iOS build — Xcode project not found."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.check.outputs.exists == 'true'
        with:
          name: lynx-bundles
          path: dist/

      - name: Copy bundle to iOS resources
        if: steps.check.outputs.exists == 'true'
        run: |
          mkdir -p ios/SpeedyBird/Resources
          cp dist/main.lynx.bundle ios/SpeedyBird/Resources/

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        if: steps.check.outputs.exists == 'true'
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true

      - name: Install CocoaPods dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ios
        run: bundle exec pod install

      - name: Build archive
        if: steps.check.outputs.exists == 'true'
        run: |
          xcodebuild archive \
            -workspace ios/SpeedyBird.xcworkspace \
            -scheme SpeedyBird \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${{ runner.temp }}/SpeedyBird.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package iOS archive
        if: steps.check.outputs.exists == 'true'
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SpeedyBird.xcarchive" "$RUNNER_TEMP/SpeedyBird.xcarchive.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.check.outputs.exists == 'true'
        with:
          name: ios-archive
          path: ${{ runner.temp }}/SpeedyBird.xcarchive.zip
          if-no-files-found: error

  # Create GitHub Release with all available artifacts
  create-release:
    needs: [build, android, ios]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          merge-multiple: false

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp artifacts/lynx-bundles/* release-assets/
          if [ -d artifacts/android-apk ]; then cp artifacts/android-apk/*.apk release-assets/; fi
          if [ -d artifacts/ios-archive ]; then cp artifacts/ios-archive/*.zip release-assets/; fi
          ls -la release-assets/

      - name: Generate tag for workflow_dispatch
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          TAG="v0.0.0-$(git rev-parse --short HEAD)"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set tag from ref
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: echo "RELEASE_TAG=$RELEASE_REF_NAME" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish immutable release after asset upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false

name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed-release:
        description: Use configured Android release signing instead of sandbox debug signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  android:
    needs: checks
    uses: ./.github/workflows/build-android.yml
    with:
      signed-release: ${{ inputs.signed-release || false }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  ios:
    needs: checks
    uses: ./.github/workflows/build-ios.yml
  publish:
    needs: [checks, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Verify expected distributions
        env:
          BUILD_TYPE: ${{ inputs.signed-release && 'release' || 'debug' }}
        run: |
          test -s release-assets/lynx-bundles.tar.gz
          test -s release-assets/web-host.tar.gz
          test -s "release-assets/speedy-bird-$BUILD_TYPE.apk"
          test -s release-assets/speedy-bird-ios-unsigned.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('sandbox-{0}-{1}', github.sha, github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Built from ${{ github.sha }} after root/docs checks and both platform builds passed.

            - Android: ${{ inputs.signed-release && 'release-keystore signed' || 'debug-signed sandbox' }} APK; installable on a compatible device. Debug keys may differ between CI runs, requiring uninstall before replacing a previous sandbox build.
            - iOS: **unsigned archive**, for Xcode inspection/signing; not a directly installable IPA.
            - Lynx bundles: embedded game sprites plus native audio and asset manifest.
            - Web host: complete static distribution including runtime, bundle, audio, and worker bridge.

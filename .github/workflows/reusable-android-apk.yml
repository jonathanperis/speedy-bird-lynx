name: Android release APK

# Reusable build shared by the main-branch build release and the versioned release.
# The job is read-only; callers own publication.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build.
        type: string
        required: true
      version-name:
        description: Android versionName and release asset suffix.
        type: string
        required: true
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-js

      - name: Build Lynx bundle
        run: bun run build

      - uses: ./.github/actions/setup-android

      # Secrets are not available to step conditions, so expose only whether signing is configured.
      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured; building an unsigned release APK."
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.configured == 'true' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version-name }}
        run: |
          # Seconds since epoch / 10 fits a 32-bit versionCode for decades and always increases.
          VERSION_CODE=$(( $(date +%s) / 10 )) ./gradlew assembleRelease --no-daemon

      - name: Remove signing keystore
        if: always() && steps.signing.outputs.configured == 'true'
        run: rm -f android/app/release.keystore

      - name: Verify packaged bundle
        run: python3 scripts/verify_android_bundle.py android/app/build/outputs/apk/release/*.apk

      - name: Name APK
        env:
          VERSION_NAME: ${{ inputs.version-name }}
        run: |
          shopt -s nullglob
          APKS=(android/app/build/outputs/apk/release/*.apk)
          test "${#APKS[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/apk"
          cp "${APKS[0]}" "$RUNNER_TEMP/apk/speedy-bird-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/speedy-bird-*.apk
          if-no-files-found: error
          retention-days: 90

name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.version.outputs.VERSION_NAME }}
      version-code: ${{ steps.version.outputs.VERSION_CODE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compute version from tag or short SHA
      - name: Set version
        id: version
        env:
          GH_REF: ${{ github.ref }}
        run: |
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            VERSION="${GH_REF#refs/tags/v}"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          # Version code: seconds since epoch / 10 (fits in 32-bit int for decades)
          VERSION_CODE=$(( $(date +%s) / 10 ))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (code: $VERSION_CODE)"

      # Build Lynx JS bundle (Bun is the standardized AGENTS.md convention for this repo)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Lynx bundle
        run: bun run build

      # Copy bundle into Android assets
      - run: cp dist/main.lynx.bundle android/app/src/main/assets/

      # Decode signing keystore (if secrets are configured)
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Build Android APK
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      # Rename APK with version
      - name: Rename APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          APKS=(android/app/build/outputs/apk/release/*.apk)
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" "android/app/build/outputs/apk/release/speedy-bird-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speedy-bird-${{ steps.version.outputs.VERSION_NAME }}-android
          path: android/app/build/outputs/apk/release/speedy-bird-*.apk
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: speedy-bird-${{ needs.build.outputs.version-name }}-android
          path: android/app/build/outputs/apk/release

      # Create GitHub Release with APK attached
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          COMMIT_SHA="$GH_SHA"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          APK_FILE="speedy-bird-${VERSION_NAME}.apk"
          APK_SIZE=$(du -h "android/app/build/outputs/apk/release/$APK_FILE" | cut -f1)

          if [[ "$GH_REF" == refs/tags/v* ]]; then
            TAG="${GH_REF#refs/tags/}"
            TITLE="Speedy Bird $TAG"
            PRERELEASE=""
          else
            TAG="build/$VERSION_NAME"
            TITLE="Speedy Bird v${VERSION_NAME}"
            PRERELEASE=""
          fi

          BODY="Automated release built from commit [\`${COMMIT_SHA}\`](https://github.com/${GH_REPO}/commit/${COMMIT_SHA}).

          ### Downloads

          | Platform | File | Size | Notes |
          |----------|------|------|-------|
          | Android | \`${APK_FILE}\` | ${APK_SIZE} | Release APK; signed only when signing secrets are configured |

          ### Build Info

          | Field | Value |
          |-------|-------|
          | Version | \`${VERSION_NAME}\` |
          | Version Code | \`${VERSION_CODE}\` |
          | Commit | [\`${SHORT_SHA}\`](https://github.com/${GH_REPO}/commit/${COMMIT_SHA}) |
          | Lynx SDK | 3.7.0 |
          | Min Android | API 21 (5.0 Lollipop) |

          > **[Play the web version](https://jonathanperis.github.io/speedy-bird-lynx/)** if you don't have an Android device."

          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --target "$GH_SHA" \
            --draft \
            --title "$TITLE" \
            --notes "$BODY" \
            $PRERELEASE \
            "android/app/build/outputs/apk/release/$APK_FILE"
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false

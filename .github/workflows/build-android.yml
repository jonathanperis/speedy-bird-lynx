name: Build Android

# Publishes an immutable build/0.0.0-<sha> prerelease. Build Check calls this after all
# of its jobs pass for a push to main; manual runs are limited to main.

on:
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.SHA }}
      version-name: ${{ steps.version.outputs.VERSION_NAME }}
    steps:
      - name: Compute build version
        id: version
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          echo "SHA=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=0.0.0-${RUN_SHA:0:7}" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    uses: ./.github/workflows/reusable-android-apk.yml
    with:
      version-name: ${{ needs.version.outputs.version-name }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  publish:
    needs: [version, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk
          path: apk

      # Build releases are prereleases so they never replace a versioned release as "Latest".
      - name: Publish build prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ needs.version.outputs.sha }}
          VERSION_NAME: ${{ needs.version.outputs.version-name }}
        run: |
          TAG="build/$VERSION_NAME"
          APK_FILE="speedy-bird-${VERSION_NAME}.apk"
          APK_SIZE=$(du -h "apk/$APK_FILE" | cut -f1)
          BODY="Automated build from commit [\`${COMMIT_SHA}\`](https://github.com/${GH_REPO}/commit/${COMMIT_SHA}) after verification passed.

          | Platform | File | Size | Notes |
          |----------|------|------|-------|
          | Android | \`${APK_FILE}\` | ${APK_SIZE} | Release APK; signed only when signing secrets are configured |

          Lynx SDK 4.1.0 · minimum Android API 21.

          > **[Play the web version](https://jonathanperis.github.io/speedy-bird-lynx/)** if you don't have an Android device."

          gh release create "$TAG" "apk/$APK_FILE" \
            --repo "$GH_REPO" \
            --target "$COMMIT_SHA" \
            --title "Speedy Bird build ${VERSION_NAME}" \
            --notes "$BODY" \
            --draft \
            --prerelease \
            --latest=false
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest=false

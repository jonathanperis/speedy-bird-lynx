name: Build Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed-release:
        description: Build with the configured release keystore (otherwise debug-signed)
        type: boolean
        default: false
  workflow_call:
    inputs:
      signed-release:
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run assets:check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check Android API compatibility
        working-directory: android
        run: ./gradlew lintDebug
      - name: Configure requested release signing
        if: inputs.signed-release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
      - name: Build signed sandbox APK
        if: ${{ !inputs.signed-release }}
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release-signed APK
        if: inputs.signed-release
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease
      - name: Verify and collect APK
        env:
          BUILD_TYPE: ${{ inputs.signed-release && 'release' || 'debug' }}
        run: |
          APK="android/app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk"
          python3 scripts/verify-apk.py "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          cp "$APK" "$RUNNER_TEMP/speedy-bird-$BUILD_TYPE.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ runner.temp }}/speedy-bird-*.apk
          if-no-files-found: error
          retention-days: 30

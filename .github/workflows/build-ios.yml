name: Build iOS
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run assets:check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler: '4.0.16'
          bundler-cache: true
          working-directory: ios
      - name: Generate host project from checked-in configuration
        run: bundle exec ruby ../scripts/generate-ios-project.rb
        working-directory: ios
      - run: bundle exec pod install --deployment
        working-directory: ios
      - name: Build unsigned device archive
        run: |
          xcodebuild archive -workspace ios/SpeedyBird.xcworkspace -scheme SpeedyBird \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SpeedyBird.xcarchive" CODE_SIGNING_ALLOWED=NO
          python3 scripts/verify-ios.py "$RUNNER_TEMP/SpeedyBird.xcarchive/Products/Applications/SpeedyBird.app"
          tar -czf "$RUNNER_TEMP/speedy-bird-ios-unsigned.tar.gz" -C "$RUNNER_TEMP" SpeedyBird.xcarchive
      - uses: actions/upload-artifact@v7
        with:
          name: ios-archive
          path: ${{ runner.temp }}/speedy-bird-ios-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 30

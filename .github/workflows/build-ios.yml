name: Build iOS

# Requires a tracked ios/SpeedyBird.xcodeproj with a shared SpeedyBird scheme,
# the Swift sources/bridging header, and main.lynx.bundle in Copy Bundle Resources.
# This workflow always builds unsigned and does not read Apple signing secrets.
# Paid membership is not needed for an unsigned archive; signed distribution
# requires separate signing implementation and Apple provisioning configuration.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Xcode project
        id: check
        run: |
          if ls ios/*.xcodeproj 1>/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping iOS build — no Xcode project found. See workflow header for setup instructions."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build Lynx JS bundle (Bun is the standardized AGENTS.md convention for this repo)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.check.outputs.exists == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: bun install --frozen-lockfile

      - name: Build Lynx bundle
        if: steps.check.outputs.exists == 'true'
        run: bun run build

      # Copy bundle into iOS app resources
      - run: cp dist/main.lynx.bundle ios/SpeedyBird/Resources/
        if: steps.check.outputs.exists == 'true'

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        if: steps.check.outputs.exists == 'true'
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true

      # Install the CocoaPods dependencies using the locked Ruby tooling.
      - run: bundle exec pod install
        working-directory: ios
        if: steps.check.outputs.exists == 'true'

      # Build unsigned archive; signing is not implemented in this workflow.
      - name: Build iOS archive
        if: steps.check.outputs.exists == 'true'
        run: |
          xcodebuild archive \
            -workspace ios/SpeedyBird.xcworkspace \
            -scheme SpeedyBird \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${{ runner.temp }}/SpeedyBird.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.check.outputs.exists == 'true'
        with:
          name: ios-archive
          path: ${{ runner.temp }}/SpeedyBird.xcarchive
          retention-days: 90
